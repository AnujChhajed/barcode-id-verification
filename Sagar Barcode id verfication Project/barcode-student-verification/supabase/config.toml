# ── Edge Function configurations ────────────────────────────────────────

# notify-parent: called from verify.tsx on denied scans
# Requires: RESEND_API_KEY, FROM_EMAIL (optional)
[functions.notify-parent]
verify_jwt = true   # called with user session token from verify.tsx

# check-card: public kiosk endpoint — no login required
# Deploy: supabase functions deploy check-card --no-verify-jwt
[functions.check-card]
verify_jwt = false

# daily-summary: triggered by pg_cron at 06:00 EAT (03:00 UTC)
# Requires: RESEND_API_KEY, ADMIN_EMAIL (or set in DB settings table)
# Deploy: supabase functions deploy daily-summary --no-verify-jwt
# Cron SQL (run once in SQL editor):
#   select cron.schedule('daily-summary', '0 3 * * *',
#     $$ select net.http_post(
#          url := '<YOUR_SUPABASE_URL>/functions/v1/daily-summary',
#          headers := '{"Content-Type":"application/json"}'::jsonb,
#          body := '{}'::jsonb); $$);
[functions.daily-summary]
verify_jwt = false
